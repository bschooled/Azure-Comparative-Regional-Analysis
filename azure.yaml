# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azure-comparative-regional-analysis
infra:
  provider: bicep
  path: infra
hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./scripts/azd/preprovision.sh
      interactive: true
  postprovision:
    posix:
      shell: sh
      run: bash ./scripts/azd/postprovision.sh
      interactive: true
  postdeploy:
    posix:
      shell: sh
      run: bash ./scripts/azd/postdeploy.sh
      interactive: true
services:
  web:
    project: ./web_app
    language: js
    host: appservice